name: prontofix
description: ProntoFix - protótipo da aplicação de reparações urgentes ao domicílio.
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Comunicação com a API REST do servidor (Node.js + MySQL)
  http: ^1.2.2
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  fonts:
    # Tipografia do Style Guide (uma só família).
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    # Ícones Lucide (traço de 2 px), mapeados em lib/theme/pf_icons.dart.
    - family: Lucide
      fonts:
        - asset: assets/fonts/lucide.ttf
